<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEMO Oracle ERP - Login</title>
  <meta http-equiv="refresh" content="0; url=./login.html" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #0d4d7e 0%, #0a3d62 100%);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      color: #fff;
    }
    .loader {
      text-align: center;
      padding: 24px 28px;
      border-radius: 16px;
      background: rgba(13, 31, 49, 0.4);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 18px 38px rgba(0,0,0,0.18);
    }
    .loader strong {
      display: block;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    .loader span {
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
    }
  </style>
  <script>
    (() => {
      const appUrl = './login.html';
      try {
        location.replace(appUrl);
      } catch (e) {
        location.href = appUrl;
      }
    })();
  </script>
</head>
<body>
  <div class="loader">
    <strong>SEMO ERP</strong>
    <span>جاري توجيهك إلى شاشة الدخول...</span>
  </div>
</body>
</html>
