<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEMO Oracle ERP - Login</title>
  <style>
    :root {
      --navy-1: #052d4d;
      --navy-2: #0c3e66;
      --navy-3: #0d5c8a;
      --blue-1: #0d6db2;
      --blue-2: #0c8ad6;
      --red-1: #d62530;
      --red-2: #ee2e3f;
      --card: rgba(255,255,255,0.96);
      --text: #1f2d3d;
      --muted: #596b7d;
      --line: #dfe7ee;
      --shadow: rgba(8, 22, 35, 0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #0d4d7e 0%, #0a3d62 100%);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
    }

    body {
      overflow: hidden;
    }

    .topbar {
      height: 85px;
      background: linear-gradient(90deg, #0b3d61 0%, #0f4c7d 35%, #0c4d7a 100%);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      padding: 0 28px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      position: relative;
      z-index: 2;
    }

    .brand {
      font-weight: 900;
      font-size: clamp(2rem, 2.5vw, 3.2rem);
      letter-spacing: 0.5px;
      line-height: 1;
      color: #f3f9ff;
      white-space: nowrap;
    }

    .brand .semo {
      color: #fff;
    }

    .brand .sep {
      color: #f4ca5f;
      margin: 0 0.12em;
    }

    .brand .oracle {
      color: #ff4a4a;
      font-weight: 900;
    }

    .login-shell {
      position: relative;
      min-height: calc(100vh - 85px);
      display: grid;
      grid-template-columns: 1.05fr 1.35fr;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(135deg, rgba(15,72,116,0.56), rgba(9,46,77,0.36));
      overflow: hidden;
    }

    .login-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(11,38,59,0.52), rgba(11,38,59,0.12));
      z-index: 0;
    }

    .login-panel {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 48px;
    }

    .card {
      width: min(590px, 100%);
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(207,221,233,0.9);
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(10, 30, 43, 0.14);
      padding: 28px 34px 22px;
    }

    .login-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 16px;
      font-size: clamp(1.9rem, 2vw, 2.4rem);
      color: var(--text);
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }

    .login-title .icon {
      font-size: 1.6em;
      line-height: 1;
      transform: translateY(-2px);
    }

    .login-sub {
      text-align: center;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.8;
    }

    .field {
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .field .icon-box {
      width: 54px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6a7787;
      background: rgba(242, 247, 251, 0.9);
      font-size: 1.4rem;
      border-left: 1px solid var(--line);
    }

    .field input {
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      padding: 0 18px 0 14px;
      font-size: 1.1rem;
      color: var(--text);
      direction: rtl;
    }

    .field input::placeholder {
      color: #7d8b9a;
    }

    .password-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 2px 18px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .password-row label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .password-row input[type="checkbox"] {
      accent-color: var(--blue-1);
      width: 15px;
      height: 15px;
    }

    .password-row .show-ps {
      white-space: nowrap;
    }

    .login-btn {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--red-2), var(--red-1));
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(214, 37, 48, 0.25);
      transition: transform 0.2s ease, filter 0.2s ease;
      margin-top: 8px;
    }

    .login-btn:hover {
      filter: brightness(1.04);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .bottom-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
      text-align: center;
    }

    .bottom-links a {
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bottom-links a:hover {
      color: var(--blue-1);
      text-decoration: underline;
    }

    .visual-panel {
      position: relative;
      z-index: 1;
      min-height: 100%;
      overflow: hidden;
      background-image: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center center;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 64px 44px 40px;
    }

    .visual-text {
      width: min(620px, 100%);
      margin-inline-start: auto;
      color: #fff;
      text-align: right;
      text-shadow: 0 3px 16px rgba(2, 9, 15, 0.38);
    }

    .visual-text .title {
      font-size: clamp(2.3rem, 2.8vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 0 0 18px;
      line-height: 1.2;
    }

    .visual-text .title .semo {
      color: #f9fdff;
    }

    .visual-text .title .oracle {
      color: #ff4d4d;
    }

    .visual-text .subtitle {
      font-size: clamp(1.15rem, 1.5vw, 1.8rem);
      margin: 0;
      font-weight: 700;
      line-height: 1.8;
      color: rgba(255,255,255,0.96);
    }

    .visual-text .tags {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 16px;
      font-size: 1rem;
      color: rgba(255,255,255,0.92);
      font-weight: 600;
    }

    .visual-text .tags span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .visual-text .tags span::before {
      content: "•";
      color: rgba(255,255,255,0.9);
      font-size: 1.2em;
      line-height: 1;
    }

    .visual-text .tags span:first-child::before {
      content: "";
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .login-shell {
        grid-template-columns: 1fr;
      }
      .visual-panel {
        min-height: 360px;
        padding-top: 40px;
      }
      .login-panel {
        padding-top: 30px;
      }
      .card {
        width: min(650px, 100%);
      }
    }

    @media (max-width: 560px) {
      .topbar {
        height: 68px;
        padding: 0 16px;
      }
      .brand {
        font-size: 1.6rem;
      }
      .login-panel {
        padding: 22px 16px;
      }
      .card {
        padding: 22px 18px 18px;
        border-radius: 14px;
      }
      .login-title {
        font-size: 1.8rem;
      }
      .field {
        height: 52px;
      }
      .field input {
        font-size: 1rem;
      }
      .login-btn {
        height: 54px;
      }
      .visual-panel {
        min-height: 300px;
        padding: 26px 18px;
      }
      .visual-text .title {
        font-size: 2rem;
      }
      .visual-text .subtitle {
        font-size: 1rem;
      }
      .visual-text .tags {
        justify-content: flex-start;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="semo">SEMO</span><span class="sep"> | </span><span class="oracle">Oracle ERP</span></div>
  </header>

  <main class="login-shell">
    <section class="login-panel">
      <div class="card">
        <h1 class="login-title"><span class="icon">🔐</span> تسجيل الدخول</h1>
        <p class="login-sub">أدخل بياناتك للوصول إلى النظام</p>

        <div class="field">
          <div class="icon-box">👤</div>
          <input id="username" type="text" placeholder="اسم المستخدم" autocomplete="username" />
        </div>

        <div class="field">
          <div class="icon-box">🔒</div>
          <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
        </div>

        <div class="password-row">
          <label><input type="checkbox" id="showPassword" /> إظهار كلمة المرور</label>
        </div>

        <button class="login-btn" id="loginBtn" type="button">دخول النظام</button>

        <div class="bottom-links">
          <a href="#">نسيت كلمة المرور؟</a>
          <span>•</span>
          <a href="#">اتصل بالدعم</a>
        </div>
      </div>
    </section>

    <section class="visual-panel">
      <div class="visual-text">
        <h2 class="title"><span class="semo">SEMO</span><span class="oracle"> | Oracle ERP</span></h2>
        <p class="subtitle">منصة إدارة شركات التطوير العقاري</p>
        <div class="tags">
          <span>إدارة مالية</span>
          <span>الم��زون</span>
          <span>المشتريات</span>
          <span>المبيعات</span>
          <span>العقارات</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const showPassword = document.getElementById('showPassword');

    showPassword.addEventListener('change', function () {
      passwordInput.type = this.checked ? 'text' : 'password';
    });

    loginBtn.addEventListener('click', function () {
      const user = (usernameInput.value || '').trim();
      const pass = (passwordInput.value || '').trim();

      if (!user || !pass) {
        alert('يرجى إدخال اسم المستخدم وكلمة المرور');
        return;
      }

      sessionStorage.setItem('semo_logged_in', '1');
      sessionStorage.setItem('semo_user', user);
      window.location.href = './SEMO_Oracle_ERP_V81_REFRESH_LOGIN_IMAGE_AND_MODULE_TOP_FIXED(1).html';
    });

    passwordInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        loginBtn.click();
      }
    });
  </script>
</body>
</html>
